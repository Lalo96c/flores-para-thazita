<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101e1a">
  <meta name="description" content="Un pequeño jardín de girasoles para Thazita, con todo mi cariño.">
  <title>Para Thazita · Flores amarillas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🌻%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=2">
  <script src="garden.js?v=2" defer></script>
</head>
<body>
  <main>
    <header><span class="mark">✳</span> UN DETALLE PARA TI <span class="edition">Flores amarillas</span></header>
    <section class="intro">
      <p class="eyebrow">PARA THAZITA, MI PERSONA FAVORITA</p>
      <h1>Contigo, todo<br><em>florece.</em></h1>
      <p class="dedication">Si pudiera regalarte un poquito de sol,<br>tendría la forma de estas flores.</p>
    </section>
    <section class="garden" aria-label="Un ramo de siete girasoles amarillos que crecen y florecen">
      <div class="halo"></div>
      <div id="flowers" aria-hidden="true"></div>
      <div class="ground"></div>
      <p class="garden-caption">Un pequeño jardín. Todo mi cariño.</p>
    </section>
    <div class="actions"><button id="bloom" type="button">Haz florecer tu ramo <span aria-hidden="true">✳</span></button><p id="status" aria-live="polite">Hay algo bonito esperando por ti.</p></div>
    <footer>Para Thazita, hoy y todos los días. <span>Con amor ♡</span></footer>
  </main>
</body>
</html>
